# The single entry point on :8080. Serves the shell and forwards everything else.
server {
  listen 8080;
  root /usr/share/nginx/html;

  # Docker's DNS. Upstreams are looked up per request, so the shell still
  # starts (and stays up) when a remote container is stopped.
  resolver 127.0.0.11 valid=5s;

  location /api/people/ {
    set $upstream http://people-api:4001;
    rewrite ^/api/people/(.*)$ /$1 break;
    proxy_pass $upstream;
    # Server-Sent Events: stream, do not buffer, keep long-lived connections open.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /api/delivery/ {
    set $upstream http://delivery-api:4002;
    rewrite ^/api/delivery/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /remotes/people/ {
    set $upstream http://people-web:80;
    rewrite ^/remotes/people/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location /remotes/delivery/ {
    set $upstream http://delivery-web:80;
    rewrite ^/remotes/delivery/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location = /config.json {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri /index.html;
  }
}
